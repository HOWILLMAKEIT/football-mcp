[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "football-mcp"
version = "0.1.0"
description = "Data-provider MCP server: football results, stats, odds and derived tables for any agent"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "mcp>=2.0,<3",
  "httpx>=0.27,<1",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<2",
  "ruff>=0.9,<1",
]

[project.scripts]
football-mcp = "football_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/football_mcp"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]
# DTZ rules are noisy for this domain: CSV match dates are naive local dates.
ignore = ["DTZ011", "DTZ007"]
