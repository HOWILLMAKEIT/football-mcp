# Publish to PyPI on every tagged release (v*).
#
# Uses PyPI trusted publishing (OIDC): no API token in secrets.
# One-time setup on pypi.org (per project):
#   Publishing → Add a new pending publisher
#     PyPI project name: football-mcp
#     Owner: HOWILLMAKEIT
#     Repository: HOWILLMAKEIT/football-mcp
#     Workflow name: publish.yml
#     Environment: pypi
# And create the "pypi" GitHub environment (Settings → Environments).

name: publish

on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Build sdist and wheel
        run: uv build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      # Required for OIDC trusted publishing.
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  publish-dsh-plugin:
    # The dsh plugin references `uvx football-mcp`, so it must land after
    # the PyPI wheel is live. Requires an NPM_TOKEN secret with publish
    # rights for the HOWILLMAKEIT npm account.
    needs: publish
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dsh-plugin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org
      - name: Publish dsh plugin to npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
