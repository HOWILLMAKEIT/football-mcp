name: publish

# npm-only release: one tag publishes the unified package `football-data-mcp`
# (npx entry + dsh plugin + embedded Python server) to npm.
# Requires an NPM_TOKEN secret with publish rights.

on:
  push:
    tags: ["v*"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --extra dev
      - run: uv run ruff check .
      - run: uv run pytest

  publish-npm:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm provenance
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org
      - name: Check tag matches package version
        run: |
          pkg_version=$(node -p "require('./package.json').version")
          test "v${pkg_version}" = "${GITHUB_REF_NAME}"
      - name: Publish to npm
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
